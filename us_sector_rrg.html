const PAD=54;
function bounds(){
  let xs=[], ys=[];

  let xmin=Math.min(...xs,98), xmax=Math.max(...xs,102);

  ctx.fillStyle='#666';ctx.font='12px sans-serif';ctx.textAlign='right';
  ctx.fillText('상대강도 (RS-Ratio) →',cv.width-PAD,cv.height-PAD+34);
  ctx.save();ctx.translate(PAD-34,PAD);ctx.rotate(-Math.PI/2);ctx.textAlign='right';ctx.fillText('모멘텀 →',0,0);ctx.restore();

  // 업종 꼬리+점
  sectors.forEach(s=>{
    if(!state[s].on) return;
    const pts=tail(s); if(!pts.length)return;
    const col=state[s].color;
    // 꼬리 선
    ctx.strokeStyle=col;ctx.lineWidth=2;ctx.globalAlpha=.55;ctx.beginPath();
    pts.forEach((p,i)=>{ const px=X(p.x),py=Y(p.y); i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
    ctx.stroke();ctx.globalAlpha=1;
    // 과거 점(작게)
    pts.forEach((p,i)=>{ if(i===pts.length-1)return;
      ctx.fillStyle=col;ctx.globalAlpha=.35+.4*(i/pts.length);
      ctx.beginPath();ctx.arc(X(p.x),Y(p.y),3,0,7);ctx.fill();ctx.globalAlpha=1; });
    // 시작 점: 속 빈 네모 (2026-10-29)
    if(pts.length>1){ const f=pts[0], sx=X(f.x), sy=Y(f.y);
      ctx.fillStyle='#fff';ctx.strokeStyle=col;ctx.lineWidth=2;
      ctx.beginPath();ctx.rect(sx-5,sy-5,10,10);ctx.fill();ctx.stroke(); }
    // 현재 점(크게)+라벨
    const last=pts[pts.length-1];
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(last.x),Y(last.y),7,0,7);ctx.fill();
    ctx.fillStyle='#111';ctx.font='bold 12px sans-serif';ctx.textAlign='left';
    ctx.fillText(s,X(last.x)+10,Y(last.y)+4);
  });
}

// ── 범례 ───────────────────────────────
const legend=document.getElementById('legend');
function buildLegend(){
  legend.innerHTML='';
  // 사분면·RS순 정렬
  const order=[...sectors].sort((a,b)=>latest(b).x-latest(a).x);
  order.forEach(s=>{
    const q=quad(latest(s).x,latest(s).y);
    const el=document.createElement('div');
    el.className='item'+(state[s].on?'':' off');
    el.innerHTML=`<span class="dot" style="background:${state[s].color}"></span>${s}<span class="q" style="color:${QCOLOR[q]}">${q}</span>`;
    el.onclick=()=>{ state[s].on=!state[s].on; el.classList.toggle('off'); draw(); };
    legend.appendChild(el);
  });
}

document.getElementById('allOn').onclick=()=>{sectors.forEach(s=>state[s].on=true);buildLegend();draw();};
document.getElementById('allOff').onclick=()=>{sectors.forEach(s=>state[s].on=false);buildLegend();draw();};
const tailSel=document.getElementById('tailSel');
tailSel.onchange=()=>{
  daily = tailSel.value==='d5';
  tailN = daily ? 5 : parseInt(tailSel.value,10);
  setMeta(); buildLegend(); draw();
};

function setMeta(){
  const a = daily ? (DATA.daily[sectors[0]]||[]) : [];
  document.getElementById('meta').textContent = daily
    ? `생성 ${DATA.generated} · 일간 · 최근 5거래일 (${a.length? a[0].d+' ~ '+a[a.length-1].d : ''}) · ${sectors.length}개 업종 · 기준: 260일 상대강도 / 20일 모멘텀`
    : `생성 ${DATA.generated} · 주간 · 꼬리 최대 ${DATA.tail_weeks}주 · ${sectors.length}개 업종 · 초기: S&P500 상회 업종만 표시`;
}
setMeta();
buildLegend();
draw();
</script>

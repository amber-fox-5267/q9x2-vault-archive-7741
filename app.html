<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0C0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>자산 대시보드</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0C0C0D; --card:#141416; --border:#2A2A2E;
    --text:#E4E4E7; --text-dim:#8E8E93; --text-bright:#F4F4F5;
    --accent:#2DD4BF; --accent2:#378ADD;
    --navh:54px;
  }
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
  /* ── 상단 네비게이션 ── */
  .nav{
    position:fixed;top:0;left:0;right:0;height:var(--navh);
    background:rgba(12,12,13,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:4px;padding:0 10px;z-index:100;
    padding-top:env(safe-area-inset-top);
    height:calc(var(--navh) + env(safe-area-inset-top))
  }
  .tab{
    appearance:none;border:none;background:transparent;color:var(--text-dim);
    font-size:14px;font-weight:600;padding:9px 13px;border-radius:9px;
    cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s
  }
  .tab:hover{color:var(--text)}
  .tab.active{background:var(--card);color:var(--accent)}
  .tab.active.namu{color:var(--accent2)}
  .spacer{flex:1}
  /* ── 드롭다운 (통합 → 계좌별) ── */
  .dd{position:relative}
  .dd-menu{
    position:absolute;top:calc(100% + 6px);left:0;min-width:150px;
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:6px;display:none;flex-direction:column;gap:2px;
    box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:200
  }
  .dd-menu.open{display:flex}
  .dd-item{
    appearance:none;border:none;background:transparent;color:var(--text);
    font-size:13px;text-align:left;padding:9px 12px;border-radius:8px;
    cursor:pointer;font-family:inherit;white-space:nowrap
  }
  .dd-item:hover{background:#1F1F22}
  .dd-item.head{color:var(--text-dim);font-size:11px;padding:6px 12px 3px;cursor:default}
  .dd-item.head:hover{background:transparent}
  /* ── 본문 iframe ── */
  .frame-wrap{
    position:fixed;left:0;right:0;bottom:0;
    top:calc(var(--navh) + env(safe-area-inset-top));
    background:var(--bg)
  }
  iframe{width:100%;height:100%;border:none;background:var(--bg)}
  /* ── 로딩/에러 오버레이 ── */
  .msg{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;color:var(--text-dim);font-size:14px;text-align:center;padding:24px
  }
  .msg.show{display:flex}
  .msg b{color:var(--text-bright);font-size:15px}
  .msg code{background:var(--card);border:1px solid var(--border);border-radius:6px;
    padding:2px 7px;font-size:12px;color:var(--accent)}
</style>
</head>
<body>

<nav class="nav">
  <button class="tab" data-route="summary">요약</button>
  <button class="tab" data-route="pension">연금</button>
  <div class="dd">
    <button class="tab namu" data-route="consolidated" id="namuTab">통합 ▾</button>
    <div class="dd-menu" id="ddMenu">
      <button class="dd-item head">계좌별</button>
      <button class="dd-item" data-route="acct_젖소">젖소</button>
      <button class="dd-item" data-route="acct_물소">물소</button>
      <button class="dd-item" data-route="acct_해외">해외</button>
      <button class="dd-item" data-route="acct_국내">국내</button>
      <button class="dd-item" data-route="acct_세금">세금</button>
      <button class="dd-item" data-route="acct_자동차보험">자동차보험</button>
      <button class="dd-item" data-route="acct_연말정산">연말정산</button>
      <button class="dd-item" data-route="acct_여행">여행</button>
    </div>
  </div>
  <div class="spacer"></div>
</nav>

<div class="frame-wrap">
  <iframe id="view" title="리포트"></iframe>
  <div class="msg" id="errMsg">
    <b>리포트를 찾을 수 없습니다</b>
    <div>해당 리포트가 아직 생성되지 않았습니다.<br>
    PC에서 리포트를 만든 뒤 <code>asset_summary.py</code>를 실행하세요.</div>
  </div>
</div>

<script>
// 라우트 → 고정 파일명
const ROUTES = {
  summary:        "summary.html",
  pension:        "pension.html",
  consolidated:   "consolidated.html",
  "acct_젖소":    "acct_젖소.html",
  "acct_물소":    "acct_물소.html",
  "acct_해외":    "acct_해외.html",
  "acct_국내":    "acct_국내.html",
  "acct_세금":    "acct_세금.html",
  "acct_자동차보험": "acct_자동차보험.html",
  "acct_연말정산":  "acct_연말정산.html",
  "acct_여행":    "acct_여행.html",
};
// 한글 키의 정규화 불일치 방지: 키를 모두 NFC로 재구성
(function(){
  const norm = {};
  for(const k in ROUTES) norm[k.normalize("NFC")] = ROUTES[k];
  for(const k in ROUTES) delete ROUTES[k];
  Object.assign(ROUTES, norm);
})();

const view   = document.getElementById("view");
const errMsg = document.getElementById("errMsg");
const ddMenu = document.getElementById("ddMenu");
const namuTab= document.getElementById("namuTab");

function setActiveTab(route){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  // 계좌별이면 '통합' 탭을 활성으로 표시
  const isAcct = route.startsWith("acct_");
  const tabRoute = isAcct ? "consolidated" : route;
  const el = document.querySelector(`.tab[data-route="${tabRoute}"]`);
  if(el) el.classList.add("active");
}

function navigate(route){
  // 한글 라우트의 유니코드 정규화 불일치(NFD/NFC) 방지
  if(route) route = route.normalize("NFC");
  if(!ROUTES[route]) route = "summary";
  errMsg.classList.remove("show");
  view.style.visibility = "hidden";
  view.src = ROUTES[route];
  setActiveTab(route);
  if(location.hash !== "#"+route) location.hash = route;
}

// iframe 로드 성공/실패 처리
view.addEventListener("load", ()=>{
  view.style.visibility = "visible";
  errMsg.classList.remove("show");
});
view.addEventListener("error", ()=>{
  view.style.visibility = "hidden";
  errMsg.classList.add("show");
});

// 탭/드롭다운 클릭
document.querySelectorAll("[data-route]").forEach(btn=>{
  btn.addEventListener("click",(e)=>{
    const route = btn.dataset.route;
    // '통합 ▾' 탭: 드롭다운만 토글하고, 통합 페이지로 이동(navigate)은 하지 않음
    // (navigate가 메뉴를 즉시 닫아버리는 것을 방지)
    if(btn.id === "namuTab"){
      const willOpen = !ddMenu.classList.contains("open");
      ddMenu.classList.toggle("open");
      // 통합 페이지가 아직 안 떠 있으면 한 번만 띄움 (메뉴는 닫지 않음)
      if(willOpen && location.hash.slice(1) !== "consolidated"){
        errMsg.classList.remove("show");
        view.style.visibility = "hidden";
        view.src = ROUTES["consolidated"];
        setActiveTab("consolidated");
        location.hash = "consolidated";
      }
      return;
    }
    navigate(route);
    ddMenu.classList.remove("open");
  });
});
// 바깥 클릭 시 드롭다운 닫기 — 단, 드롭다운 영역(.dd) 안의 클릭은 무시
document.addEventListener("click",(e)=>{
  if(!e.target.closest(".dd")) ddMenu.classList.remove("open");
});

// 해시 변경(뒤로가기 등) 대응
window.addEventListener("hashchange",()=>{
  navigate(decodeURIComponent(location.hash.slice(1)) || "summary");
});

// 초기 진입
navigate(decodeURIComponent(location.hash.slice(1)) || "summary");
</script>
</body>
</html>

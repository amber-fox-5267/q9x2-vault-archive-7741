<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코스피 업종 RRG</title>
<style>
  :root{
    --lead:#1e7d3c; --improve:#1a56b0; --weaken:#a67c00; --lag:#b3261e;
    --bg-lead:#e6f4ea; --bg-improve:#e8f0fe; --bg-weaken:#fef7e0; --bg-lag:#fdecea;
    --ink:#222; --sub:#777; --line:#e0e0e0;
  }
  *{box-sizing:border-box}
  body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#fafafa;margin:0;padding:20px;color:var(--ink)}
  .wrap{max-width:1080px;margin:0 auto}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--sub);font-size:12px;margin:0 0 14px}
  .layout{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
  .chartbox{flex:1;min-width:520px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
  canvas{width:100%;height:auto;display:block}
  .side{width:230px;flex-shrink:0}
  .ctrl{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  .ctrl button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid #ccc;border-radius:6px;background:#f7f7f7;cursor:pointer;margin:2px}
  .ctrl select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;width:100%}
  .ctrl button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .legend{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;max-height:420px;overflow:auto}
  .legend .item{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:13px;user-select:none}
  .legend .item:hover{background:#f2f2f2}
  .legend .item.off{opacity:.32}
  .legend .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
  .legend .q{font-size:10px;color:var(--sub);margin-left:auto}
  .tip{font-size:11px;color:var(--sub);line-height:1.6;margin-top:8px}
</style>
</head>

6-10-26", "x": 100.59, "y": 102.48}], "사료": [{"d": "2026-10-20", "x": 100.07, "y": 101.06}, {"d": "2026-10-21", "x": 100.11, "y": 101.5}, {"d": "2026-10-22", "x": 100.26, "y": 101.82}, {"d": "2026-10-23", "x": 100.35, "y": 102.24}, {"d": "2026-10-26", "x": 100.44, "y": 102.22}], "제지": [{"d": "2026-10-20", "x": 99.47, "y": 99.55}, {"d": "2026-10-21", "x": 99.4, "y": 99.47}, {"d": "2026-10-22", "x": 99.61, "y": 100.26}, {"d": "2026-10-23", "x": 99.61, "y": 100.51}, {"d": "2026-10-26", "x": 99.71, "y": 100.36}], "골판지 제조": [{"d": "2026-10-20", "x": 99.2, "y": 97.96}, {"d": "2026-10-21", "x": 99.08, "y": 97.82}, {"d": "2026-10-22", "x": 99.06, "y": 98.2}, {"d": "2026-10-23", "x": 99.15, "y": 98.8}, {"d": "2026-10-26", "x": 99.15, "y": 99.05}]}}};   // rrg.py export_json 결과를 여기 주입

const QCOLOR = {주도:'#1e7d3c', 개선:'#1a56b0', 약화:'#a67c00', 소외:'#b3261e'};
function quad(x,y){ if(x>=100&&y>=100)return'주도'; if(x<100&&y>=100)return'개선'; if(x<100&&y<100)return'소외'; return'약화'; }

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const GROUPS = DATA.groups || {"업종": DATA.sectors};   // 구버전 JSON 호환
const groupNames = Object.keys(GROUPS);
let curGroup = groupNames[0];
let sectors = Object.keys(GROUPS[curGroup]);
let tailN = 4;                   // 기본 1개월(4주). 드롭다운으로 4/13/26/52주 선택
let daily = false;               // true: 일간 RRG(최근 5거래일) — 2026-10-18
const DGROUPS = DATA.daily_groups || {};
function SRC(){ return (daily && DGROUPS[curGroup]) ? DGROUPS[curGroup] : GROUPS[curGroup]; }
const state = {};                // 업종별 on/off

// 색상 팔레트 (업종 구분용, 사분면색과 별개로 점 궤적에 사용)
const palette = ['#e6194B','#3cb44b','#4363d8','#f58231','#911eb4','#42d4f4','#f032e6','#bfef45','#fabed4','#469990','#dcbeff','#9A6324','#800000','#aaffc3','#808000','#000075','#a9a9a9','#e6beff','#ffd8b1'];
// 그룹 초기화: 색·초기표시(코스피 상회만) 재설정
function initGroup(g){
  curGroup = g;
  sectors = Object.keys(GROUPS[g]);
  for (const k in state) delete state[k];
  sectors.forEach((s,i)=> state[s]={on:true, color:palette[i%palette.length]});
  sectors.forEach(s=>{ state[s].on = latest(s).x >= 100; });
}

// 최신 좌표로 사분면·초기필터
function latest(s){ const a=SRC()[s]||GROUPS[curGroup][s]; return a[a.length-1]; }
// 그룹 토글 버튼 (그룹이 하나면 박스 숨김)
const gBox = document.getElementById('groupBox');
if (groupNames.length < 2) { gBox.style.display = 'none'; }
else {
  groupNames.forEach(g => {
    const b = document.createElement('button');
    b.textContent = g;
    if (g === curGroup) b.classList.add('on');
    b.onclick = () => {
      initGroup(g);
      gBox.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.textContent === g));
      if (typeof setMeta==='function') setMeta();
      buildLegend(); draw();
    };
    gBox.appendChild(b);
  });
}
initGroup(curGroup);

// ── 좌표 변환 ───────────────────────────────
const PAD=54;
function bounds(){
  let xs=[], ys=[];
  sectors.forEach(s=>{ const pts=tail(s); pts.forEach(p=>{xs.push(p.x);ys.push(p.y);}); });
  let xmin=Math.min(...xs,98), xmax=Math.max(...xs,102);
  let ymin=Math.min(...ys,98), ymax=Math.max(...ys,102);
  const mx=(xmax-xmin)*0.12||1, my=(ymax-ymin)*0.12||1;
  xmin-=mx;xmax+=mx;ymin-=my;ymax+=my;
  // 100이 중앙에 오도록 대칭 보정
  const xr=Math.max(100-xmin,xmax-100), yr=Math.max(100-ymin,ymax-100);
  return {xmin:100-xr,xmax:100+xr,ymin:100-yr,ymax:100+yr};
}
function tail(s){ const a=SRC()[s]||[]; return a.slice(Math.max(0,a.length-tailN)); }
let B;
function X(v){ return PAD + (v-B.xmin)/(B.xmax-B.xmin)*(cv.width-2*PAD); }
function Y(v){ return cv.height-PAD - (v-B.ymin)/(B.ymax-B.ymin)*(cv.height-2*PAD); }

function draw(){
  B=bounds();
  ctx.clearRect(0,0,cv.width,cv.height);
  const x100=X(100), y100=Y(100);
  // 사분면 배경
  ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--bg-improve');
  ctx.fillRect(PAD,PAD,x100-PAD,y100-PAD);                       // 좌상 개선
  ctx.fillStyle='#e6f4ea'; ctx.fillRect(x100,PAD,cv.width-PAD-x100,y100-PAD); // 우상 주도
  ctx.fillStyle='#fdecea'; ctx.fillRect(PAD,y100,x100-PAD,cv.height-PAD-y100);// 좌하 소외
  ctx.fillStyle='#fef7e0'; ctx.fillRect(x100,y100,cv.width-PAD-x100,cv.height-PAD-y100);//우하 약화
  // 축
  ctx.strokeStyle='#999';ctx.setLineDash([4,3]);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x100,PAD);ctx.lineTo(x100,cv.height-PAD);
  ctx.moveTo(PAD,y100);ctx.lineTo(cv.width-PAD,y100);ctx.stroke();ctx.setLineDash([]);
  // 사분면 라벨
  ctx.font='bold 14px sans-serif';ctx.textAlign='left';
  ctx.fillStyle='#1e7d3c';ctx.fillText('주도 Leading',x100+8,PAD+18);
  ctx.fillStyle='#1a56b0';ctx.fillText('개선 Improving',PAD+8,PAD+18);
  ctx.fillStyle='#a67c00';ctx.textAlign='right';ctx.fillText('약화 Weakening',cv.width-PAD-6,cv.height-PAD-8);
  ctx.fillStyle='#b3261e';ctx.textAlign='left';ctx.fillText('소외 Lagging',PAD+8,cv.height-PAD-8);
  // 축 이름
  ctx.fillStyle='#666';ctx.font='12px sans-serif';ctx.textAlign='right';
  ctx.fillText('상대강도 (RS-Ratio) →',cv.width-PAD,cv.height-PAD+34);
  ctx.save();ctx.translate(PAD-34,PAD);ctx.rotate(-Math.PI/2);ctx.textAlign='right';ctx.fillText('모멘텀 →',0,0);ctx.restore();

  // 업종 꼬리+점
  sectors.forEach(s=>{
    if(!state[s].on) return;
    const pts=tail(s); if(!pts.length)return;
    const col=state[s].color;
    // 꼬리 선
    ctx.strokeStyle=col;ctx.lineWidth=2;ctx.globalAlpha=.55;ctx.beginPath();
    pts.forEach((p,i)=>{ const px=X(p.x),py=Y(p.y); i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
    ctx.stroke();ctx.globalAlpha=1;
    // 과거 점(작게)
    pts.forEach((p,i)=>{ if(i===pts.length-1)return;
      ctx.fillStyle=col;ctx.globalAlpha=.35+.4*(i/pts.length);
      ctx.beginPath();ctx.arc(X(p.x),Y(p.y),3,0,7);ctx.fill();ctx.globalAlpha=1; });
    // 현재 점(크게)+라벨
    const last=pts[pts.length-1];
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(last.x),Y(last.y),7,0,7);ctx.fill();
    ctx.fillStyle='#111';ctx.font='bold 12px sans-serif';ctx.textAlign='left';
    ctx.fillText(s,X(last.x)+10,Y(last.y)+4);
  });
}

// ── 범례 ───────────────────────────────
const legend=document.getElementById('legend');
function buildLegend(){
  legend.innerHTML='';
  // 사분면·RS순 정렬
  const order=[...sectors].sort((a,b)=>latest(b).x-latest(a).x);
  order.forEach(s=>{
    const q=quad(latest(s).x,latest(s).y);
    const el=document.createElement('div');
    el.className='item'+(state[s].on?'':' off');
    el.innerHTML=`<span class="dot" style="background:${state[s].color}"></span>${s}<span class="q" style="color:${QCOLOR[q]}">${q}</span>`;
    el.onclick=()=>{ state[s].on=!state[s].on; el.classList.toggle('off'); draw(); };
    legend.appendChild(el);
  });
}

document.getElementById('allOn').onclick=()=>{sectors.forEach(s=>state[s].on=true);buildLegend();draw();};
document.getElementById('allOff').onclick=()=>{sectors.forEach(s=>state[s].on=false);buildLegend();draw();};
const tailSel=document.getElementById('tailSel');
tailSel.onchange=()=>{
  daily = tailSel.value==='d5';
  tailN = daily ? 5 : parseInt(tailSel.value,10);
  setMeta(); buildLegend(); draw();
};
function setMeta(){
  const any = daily ? Object.values(DGROUPS[curGroup]||{})[0] : null;
  document.getElementById('meta').textContent = daily
    ? `생성 ${DATA.generated} · 일간 · 최근 5거래일 (${any&&any.length? any[0].d+' ~ '+any[any.length-1].d : ''}) · 기준: 260일 상대강도 / 20일 모멘텀`
    : `생성 ${DATA.generated} · 주간 · 꼬리 최대 ${DATA.tail_weeks}주 · ${groupNames.map(g=>g+' '+Object.keys(GROUPS[g]).length+'개').join(' / ')} · 초기: 코스피 상회만 표시`;
}
setMeta();
buildLegend();
draw();
</script>

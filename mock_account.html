<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>모의계좌</title>
<style>
:root{--ink:#1c1c1e;--sub:#8e8e93;--line:#e5e5ea;--bg:#f2f2f7;--card:#fff;--pos:#e5484d;--neg:#3b82f6}
@media (prefers-color-scheme:dark){:root{--ink:#f2f2f7;--sub:#98989d;--line:#38383a;--bg:#000;--card:#1c1c1e}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Malgun Gothic',sans-serif;padding:16px}
.wrap{max-width:900px;margin:0 auto} h1{font-size:20px;margin:0} .s{font-size:11px;color:var(--sub)}
.card{background:var(--card);border-radius:12px;padding:14px;margin-top:12px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{font-size:20px;font-weight:700;margin-top:2px} .pos{color:var(--pos)} .neg{color:var(--neg)}
table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;color:var(--sub);font-weight:500} .r{text-align:right} .ct{font-weight:600;margin-bottom:6px}
</style></head><body><div class="wrap">
<h1>나무 모의계좌</h1>
<div class="s">갱신 2026-10-29 11:25 · 장중 10분마다 + 체결 직후 · 가격은 갱신 시점 기준</div>
<div class="card kpi">
 <div><div class="s">총자산</div><div class="k">498,919,460원</div><div class="s">현금 + 주식</div></div>
 <div><div class="s">누적 수익률</div><div class='k neg'>-0.22%</div><div class='s'>시작 원금 500,000,000원 대비</div></div>
 <div><div class="s">평가손익</div><div class="k ">+0원</div><div class="s">보유 0종목</div></div>
 <div><div class="s">오늘 실현손익</div><div class="k ">+0원</div><div class="s">체결 0건</div></div>
 <div><div class="s">주문가능 현금</div><div class="k">498,919,460원</div><div class="s">D+2 기준</div></div>
</div>
<div class="card"><div class="ct">보유 종목</div><div style="overflow-x:auto"><table>
<tr><th>종목</th><th class="r">수량</th><th class="r">평단</th><th class="r">현재가</th><th class="r">평가금액</th><th class="r">손익</th></tr>
<tr><td colspan='6' class='s' style='text-align:center;padding:14px'>보유 종목 없음</td></tr></table></div></div>
<div class="card"><div class="ct">오늘 체결</div><div style="overflow-x:auto"><table>
<tr><th>시각</th><th>종목</th><th>구분</th><th class="r">수량</th><th class="r">가격</th><th class="r">실현손익</th></tr>
<tr><td colspan='6' class='s' style='text-align:center;padding:14px'>오늘 체결 없음</td></tr></table></div></div>
</div></body></html>
